name: Chromium smoke test
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: |
          git cat-file -e 03467c55e76c68a9cd912c737638de9e7114461e:public/index.html
          git cat-file -e 03467c55e76c68a9cd912c737638de9e7114461e:build.mjs
          mkdir -p baseline/public
          git show 03467c55e76c68a9cd912c737638de9e7114461e:public/index.html > baseline/public/index.html
          git show 03467c55e76c68a9cd912c737638de9e7114461e:build.mjs > baseline/build.mjs
          (cd baseline && SITE_URL=https://transporterd-860.pages.dev node build.mjs)
          SITE_URL=https://transporterd-860.pages.dev node build.mjs
      - run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          import {createServer} from 'node:http';
          import {readFileSync,mkdirSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const server=createServer((req,res)=>{try{const path=new URL(req.url,'http://localhost').pathname;res.setHeader('Content-Type',path.endsWith('.xml')?'application/xml':'text/html; charset=utf-8');res.end(readFileSync((path.startsWith('/baseline/')?'baseline/public'+path.slice(9):'public'+path)+(path.endsWith('/')?'index.html':'')))}catch{res.statusCode=404;res.end()}});
          await new Promise(r=>server.listen(0,'127.0.0.1',r));const origin='http://127.0.0.1:'+server.address().port;const browser=await chromium.launch();mkdirSync('screenshots',{recursive:true});
          try{
          for(const width of [375,1440]){const p=await browser.newPage({viewport:{width,height:900},locale:'es-DO'});await p.goto(origin+'/baseline/es/');await p.screenshot({path:'screenshots/before-es-'+width+'.png'});await p.close()}
          for(const width of [375,768,1440])for(const mode of ['lite','modern']){
          const ctx=await browser.newContext({viewport:{width,height:900},locale:'es-DO'});await ctx.addInitScript(m=>{if(!localStorage.getItem('display-mode'))localStorage.setItem('display-mode',m)},mode);
          const p=await ctx.newPage(),errors=[],images=[];p.on('pageerror',e=>errors.push(e.message));p.on('request',r=>{if(r.resourceType()==='image')images.push(r.url())});
          await p.goto(origin+'/');assert.equal(await p.locator('html').getAttribute('lang'),'es');
          for(const lang of ['es','en','fr','pt','it','de']){
          if(new URL(p.url()).pathname==='/'){await p.locator('#language').selectOption(lang);await p.goto(origin+'/'+lang+'/');}else{await Promise.all([p.waitForURL(origin+'/'+lang+'/'),p.locator('#language').selectOption(lang)]);}assert.equal(await p.locator('html').getAttribute('lang'),lang);assert.equal(await p.locator('html').getAttribute('data-mode'),mode);assert.equal(await p.locator('#display-mode').inputValue(),mode);assert.equal(await p.locator('link[hreflang]').count(),7);assert.equal(await p.locator('link[rel=canonical]').getAttribute('href'),'https://transporterd-860.pages.dev/'+lang+'/');assert.ok(await p.evaluate(()=>document.documentElement.scrollWidth<=innerWidth));
          assert.equal(await p.locator('#results p').count(),19);assert.equal(await p.locator('.operator li').count(),4);assert.equal(await p.locator('#more-items p').count(),8);assert.ok((await p.locator('#more-items').innerText()).includes('Aeropuerto Punta Cana'));
          await p.screenshot({path:'screenshots/'+lang+'-'+width+'-'+mode+'.png'});
          await p.locator('#filter').fill('Sosua');assert.ok((await p.locator('#results').innerText()).includes('Sosúa'));await p.locator('#filter').fill('zzzz');assert.equal(await p.locator('#results p').count(),0);await p.locator('#filter').fill('Punta Cana');assert.equal(await p.locator('#results p').count(),2);assert.ok((await p.locator('#results').innerText()).includes('Expreso Bávaro'));
          }
          const other=mode==='lite'?'modern':'lite';await p.locator('#display-mode').selectOption(other);await p.reload();assert.equal(await p.locator('#display-mode').inputValue(),other);assert.deepEqual(errors,[]);assert.equal(images.length,0);console.log(width,mode,'all six languages passed, zero image requests');await ctx.close();
          }
          for(const l of ['es','en','fr','pt','it','de'])assert.ok(readFileSync('public/sitemap.xml','utf8').includes('https://transporterd-860.pages.dev/'+l+'/'));assert.ok(readFileSync('public/robots.txt','utf8').includes('https://transporterd-860.pages.dev/sitemap.xml'));assert.equal(readFileSync('public/google62b1133f7c042e9b.html','utf8').trim(),'google-site-verification: google62b1133f7c042e9b.html');
          }finally{await browser.close();server.close()}
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: visual-review
          path: screenshots

<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TransporteRD</title><meta name="description" content="Buscar rutas"><style>*{box-sizing:border-box}body{margin:0;background:#f5f6f7;color:#16252d;font:17px system-ui}header,main,footer{max-width:1100px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}section{background:#086b66;color:#fff;padding:clamp(24px,6vw,70px);border-radius:24px}h1{font-size:clamp(32px,6vw,64px)}article,.calc,#results{padding:20px;background:#fff;margin:16px 0;border-radius:16px}button,input,select{font:inherit;max-width:100%;padding:10px;margin:5px;border:1px solid #bbb;border-radius:8px}button{cursor:pointer}a{color:#086b66;overflow-wrap:anywhere}output{display:block;font-size:2rem}</style></head><body><header><strong>TransporteRD</strong><select id="language" aria-label="Language"><option value="de">DE</option><option value="es">ES</option><option value="en">EN</option><option value="fr">FR</option><option value="pt">PT</option></select></header><main><section><h1 id="heading">Buscar rutas</h1><p id="intro">Consulta el horario del operador. Precios sin confirmar.</p></section><input id="filter" aria-label="City" placeholder="Santiago / Santo Domingo"><div id="results"></div><script>const routes=[["Santo Domingo","Santiago"],["Santo Domingo","Puerto Plata"],["Santo Domingo","Sosúa"],["Santiago","Santo Domingo"],["Santiago","Puerto Plata"],["Santiago","Sosúa"],["Puerto Plata","Santiago"],["Puerto Plata","Santo Domingo"],["Sosúa","Santiago"],["Sosúa","Santo Domingo"]];const f=document.querySelector('#filter');function render(){document.querySelector('#results').replaceChildren(...routes.filter(r=>r.join(' ').toLowerCase().includes(f.value.toLowerCase())).map(r=>{const a=document.createElement('p');a.textContent=r.join(' → ')+' · Metro';return a}))}f.addEventListener('input',render);render()</script><article><a href="https://metroserviciosturisticos.com/index.php/horarios">Metro Servicios Turísticos</a><p>2026-11-25</p></article></main><footer>TransporteRD · República Dominicana</footer><script>const langs=["de","es","en","fr","pt"],titles=["Verbindungen finden","Buscar rutas","Find routes","Trouver des trajets","Encontrar rotas"],intro=["Fahrplan beim Betreiber prüfen. Preise nicht bestätigt.","Consulta el horario del operador. Precios sin confirmar.","Check the operator’s timetable. Fares unconfirmed.","Consultez les horaires de l’opérateur. Tarifs non confirmés.","Consulte os horários da operadora. Tarifas não confirmadas."];const s=document.querySelector('#language');function apply(l){if(!langs.includes(l))l='es';const i=langs.indexOf(l);document.documentElement.lang=l;s.value=l;document.querySelector('#heading').textContent=titles[i];document.querySelector('#intro').textContent=intro[i];document.title=titles[i]+' | TransporteRD';}let stored;try{stored=localStorage.getItem('language')}catch{}apply(stored||navigator.language.slice(0,2));s.addEventListener('change',()=>{apply(s.value);try{localStorage.setItem('language',s.value)}catch{}})</script></body></html>
